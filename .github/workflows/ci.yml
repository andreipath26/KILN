name: CI

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Do not cancel an in-progress full native build on every integration commit:
# finish one meaningful validation while coalescing superseded pending PR runs.
# Main-branch verification uses its own group and is never interrupted.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository and llama.cpp submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify native build tools already present on Ubuntu runner
        run: |
          cmake --version
          c++ --version
          make --version

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Build llama.cpp static libraries
        run: |
          cmake -S vendor/llama.cpp -B vendor/llama.cpp/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_TOOLS=OFF \
            -DLLAMA_BUILD_COMMON=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            -DLLAMA_BUILD_APP=OFF
          cmake --build vendor/llama.cpp/build --config Release --parallel 2

      - name: Check formatting (advisory until baseline formatting debt is resolved)
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: Test synthetic MoE cache simulator
        run: python3 -m unittest scripts.test_synthetic_moe_cache_bench -v

      - name: Unit-test controlled candidate-vs-FP16 quality parity assessor
        run: python3 -m unittest scripts.test_compare_quality_parity -v

      - name: Test Tier 0 feasibility report assessor
        run: |
          python3 -m unittest scripts.test_assess_tier0_gate5a -v
          python3 -m unittest scripts.test_compare_lazy_moe -v
          python3 -m unittest scripts.test_convert_moe_router_trace -v

      - name: Test Phase 3.5 evidence summary and capture scripts
        run: |
          python3 -m unittest scripts.test_summarize_phase35 -v
          python3 -m unittest scripts.test_capture_phase35_ollama -v
          bash -n scripts/run_phase35_suite.sh scripts/run_tier0_dense_matrix.sh scripts/profile_phase35_hotpath.sh scripts/run_tier0_gate5a.sh scripts/capture_moe_router_phase5a.sh scripts/run_cpu_moe_stream_experiment.sh scripts/build_linux_release.sh scripts/install_linux_release.sh

      - name: Run workspace tests
        run: cargo test --locked --workspace --all-targets

      - name: Build the API executable for browser testing
        run: cargo build --locked -p kiln-cli

      - name: Set up Node.js for local UI release checks
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/ui-e2e/package-lock.json

      - name: Install UI browser-test dependencies
        run: npm ci --prefix tools/ui-e2e

      - name: Install headless Chromium
        run: npx --prefix tools/ui-e2e playwright install --with-deps chromium

      - name: Start the local API without a model
        run: |
          mkdir -p "$RUNNER_TEMP/kiln-models"
          KILN_MODELS_DIR="$RUNNER_TEMP/kiln-models" target/debug/kiln serve --host 127.0.0.1 --port 11435 > "$RUNNER_TEMP/kiln-api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/kiln-api.pid"
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:11435/api/version >/dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/kiln-api.log"
          exit 1

      - name: Run browser, accessibility, and responsive UI checks
        run: npm test --prefix tools/ui-e2e

      - name: Stop the no-model API
        if: always()
        run: if [ -f "$RUNNER_TEMP/kiln-api.pid" ]; then kill "$(cat "$RUNNER_TEMP/kiln-api.pid")" || true; fi

      - name: Download and verify a real smoke-test model
        env:
          KILN_MODELS_DIR: ${{ runner.temp }}/kiln-models
        run: target/debug/kiln pull QuantFactory/SmolLM2-135M-Instruct-GGUF --file SmolLM2-135M-Instruct.Q4_K_M.gguf

      - name: Validate real GGUF zero-copy Ollama manifest discovery
        run: |
          MODEL="$RUNNER_TEMP/kiln-models/QuantFactory--SmolLM2-135M-Instruct-GGUF/SmolLM2-135M-Instruct.Q4_K_M.gguf"
          OLLAMA_ROOT="$RUNNER_TEMP/kiln-ollama-manifest-smoke"
          mkdir -p "$OLLAMA_ROOT/blobs" "$OLLAMA_ROOT/manifests/registry.ollama.ai/library/integration-fixture"
          DIGEST="$(sha256sum "$MODEL" | cut -d ' ' -f 1)"
          ln "$MODEL" "$OLLAMA_ROOT/blobs/sha256-$DIGEST"
          python3 - "$OLLAMA_ROOT" "$DIGEST" <<'PY'
          import json
          import pathlib
          import sys
          root = pathlib.Path(sys.argv[1])
          digest = sys.argv[2]
          payload = {"schemaVersion": 2, "layers": [
              {"mediaType": "application/vnd.ollama.image.model",
               "digest": "sha256:" + digest}
          ]}
          manifest = root / "manifests/registry.ollama.ai/library/integration-fixture/latest"
          manifest.write_text(json.dumps(payload), encoding="utf-8")
          (manifest.parent / "stable").write_text(json.dumps(payload), encoding="utf-8")
          PY
          OLLAMA_MODELS="$OLLAMA_ROOT" \
            target/debug/kiln list --json > "$RUNNER_TEMP/ollama-manifest-model-list.json"
          python3 - "$RUNNER_TEMP/ollama-manifest-model-list.json" "$OLLAMA_ROOT" <<'PY'
          import json
          import pathlib
          import sys
          entries = json.load(open(sys.argv[1], encoding="utf-8"))
          root = pathlib.Path(sys.argv[2]).resolve()
          entries = [item for item in entries
                     if pathlib.Path(item["path"]).is_relative_to(root)]
          assert len(entries) == 1, "one physical Ollama GGUF should not duplicate tag models"
          row = entries[0]
          assert row["valid_gguf"] is True
          assert row["source"] == "Ollama manifest"
          assert set(row["aliases"]) == {"integration-fixture:latest",
                                         "integration-fixture:stable"}
          assert row["name"] in row["aliases"]
          assert pathlib.Path(row["path"]).stat().st_ino > 0
          print("Installed Ollama model tags resolve to a single valid GGUF without copying weights")
          PY

      - name: Verify lazy-MoE A/B inference harness against actual dense GGUF
        env:
          KILN_TEST_MODEL_PATH: ${{ runner.temp }}/kiln-models/QuantFactory--SmolLM2-135M-Instruct-GGUF/SmolLM2-135M-Instruct.Q4_K_M.gguf
        run: |
          python3 scripts/compare_lazy_moe.py "$KILN_TEST_MODEL_PATH" \
            --kiln-bin target/debug/kiln --out "$RUNNER_TEMP/lazy-moe-ab.json" \
            --tokens 8 --threads 2 --batch 128 --ubatch 64 \
            --warmup 1 --runs 1 --pairs 1
          python3 - "$RUNNER_TEMP/lazy-moe-ab.json" <<'PY'
          import json
          import sys
          report = json.load(open(sys.argv[1], encoding="utf-8"))
          assert report["evaluation"]["token_parity_exact"]
          assert len(report["captures"]) == 2
          print("Real GGUF A/B loader and exact greedy parity smoke passed")
          PY

      - name: Smoke-test actual routed MoE expert IDs from CPU graph
        env:
          KILN_MODELS_DIR: ${{ runner.temp }}/kiln-models
        run: |
          target/debug/kiln pull mradermacher/tiny-random-granite-moe-GGUF \
            --file tiny-random-granite-moe.Q4_K_M.gguf
          MODEL="$KILN_MODELS_DIR/mradermacher--tiny-random-granite-moe-GGUF/tiny-random-granite-moe.Q4_K_M.gguf"
          test -s "$MODEL"
          target/debug/kiln plan "$MODEL" --json > "$RUNNER_TEMP/moe-plan.json"
          KILN_MODELS_DIR="$KILN_MODELS_DIR" \
            target/debug/kiln plan "$(basename "$MODEL")" --json > "$RUNNER_TEMP/moe-plan-by-name.json"
          python3 - "$RUNNER_TEMP/moe-plan-by-name.json" <<'PY'
          import json
          import sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          assert data["recommendations"]["verified_fused_expert_tensor_count"] > 0
          print("Installed GGUF display name resolves to exact model for hardware preflight")
          PY
          python3 - "$RUNNER_TEMP/moe-plan.json" <<'PY'
          import json
          import sys
          report = json.load(open(sys.argv[1], encoding="utf-8"))
          rec = report["recommendations"]
          assert rec["cpu_moe_selected_expert_external_compute_experimental"] is True
          assert rec["verified_fused_expert_tensor_count"] > 0
          assert rec["cpu_moe_streamed_end_to_end_ready"] is False
          print("Model preflight accurately identifies opt-in actual expert graph mode, not deployment readiness")
          PY
          printf 'Hello from the KILN smoke test.\n/exit\n' | \
            timeout 120 target/debug/kiln stream "$MODEL" --max-tokens 6 \
              --cache-mib 8 --parallel-reads > "$RUNNER_TEMP/moe-cli-stream.txt" \
              2> "$RUNNER_TEMP/moe-cli-stream-evidence.txt"
          python3 - "$RUNNER_TEMP/moe-cli-stream.txt" "$RUNNER_TEMP/moe-cli-stream-evidence.txt" <<'PY'
          import pathlib
          import re
          import sys
          output = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")
          audit = pathlib.Path(sys.argv[2]).read_text(encoding="utf-8")
          assert "KILN interactive session" in output and "kiln>" in output
          matched = re.search(
              r"KILN external expert graph verified: (\d+) tensors, (\d+) operand bytes, "
              r"(\d+) pread bytes .*?, (\d+) hot expert cache hits", audit)
          assert matched, "interactive runner did not verify all external expert projections"
          count, operands, reads, hits = map(int, matched.groups())
          assert count > 0 and operands > 0 and 0 <= reads <= operands and hits >= 0
          print("One-binary kiln stream verified every expected original-GGUF external expert projection")
          PY
          KILN_MOE_ROUTER_TRACE="$RUNNER_TEMP/real-moe-router.tsv" \
            target/debug/kiln bench "$MODEL" --native-greedy \
              --tokens 8 --warmup 0 --runs 1 --threads 2 --batch 128 \
              --ubatch 64 --json > "$RUNNER_TEMP/real-moe-inference.json"
          test -s "$RUNNER_TEMP/real-moe-router.tsv"
          python3 scripts/convert_moe_router_trace.py "$RUNNER_TEMP/real-moe-router.tsv" \
            --out "$RUNNER_TEMP/real-moe-router.json"
          python3 - "$RUNNER_TEMP/real-moe-router.json" <<'PY'
          import json
          import sys
          events = json.load(open(sys.argv[1], encoding="utf-8"))
          assert events and all(type(x["layer"]) is int and
                                type(x["expert_id"]) is int for x in events)
          print(f"Actual MoE graph expert IDs captured: {len(events)} operator selections")
          PY
          KILN_MOE_WILLNEED=1 target/debug/kiln bench "$MODEL" \
            --native-greedy --tokens 8 --warmup 0 --runs 1 --threads 2 \
            --batch 128 --ubatch 64 --json > "$RUNNER_TEMP/real-moe-page-advice.json"
          python3 - "$RUNNER_TEMP/real-moe-inference.json" "$RUNNER_TEMP/real-moe-page-advice.json" <<'PY'
          import json
          import sys
          baseline, advised = (json.load(open(p, encoding="utf-8")) for p in sys.argv[1:])
          assert baseline["runs"][0]["token_fingerprint_fnv1a64"] == advised["runs"][0]["token_fingerprint_fnv1a64"]
          assert baseline["runs"][0]["generated_tokens"] == advised["runs"][0]["generated_tokens"]
          print("CPU MoE graph-selected page advice preserved exact generated token sequence")
          PY
          python3 scripts/compare_lazy_moe.py "$MODEL" \
            --kiln-bin target/debug/kiln --out "$RUNNER_TEMP/real-moe-lazy-ab.json" \
            --tokens 8 --threads 2 --batch 128 --ubatch 64 --warmup 1 \
            --runs 1 --pairs 1
          python3 - "$RUNNER_TEMP/real-moe-lazy-ab.json" <<'PY'
          import json
          import sys
          report = json.load(open(sys.argv[1], encoding="utf-8"))
          assert report["evaluation"]["token_parity_exact"]
          print("Actual MoE model normal/lazy inference maintained exact greedy parity")
          PY
          # Exercise actual fused GGUF expert extraction against authoritative
          # router selections; packed data remains a diagnostic source.
          cargo build -p kiln-bench
          target/debug/kiln-bench expert-inspect-fused --source-gguf "$MODEL" \
            --json > "$RUNNER_TEMP/moe-fused-candidates.json"
          python3 - "$RUNNER_TEMP" <<'PY'
          import json
          import pathlib
          import re
          import sys
          root = pathlib.Path(sys.argv[1])
          events = json.loads((root / "real-moe-router.json").read_text())
          report = json.loads((root / "moe-fused-candidates.json").read_text())
          choices = []
          for item in report["three_dimensional_tensors"]:
              name = item["tensor_name"]
              found = re.fullmatch(r"blk\.(\d+)\.ffn_(up|down|gate)_exps\.weight", name)
              if found:
                  # This CI fixture has explicitly verified third-axis
                  # expert slabs. Do not assume arbitrary model 3D axes.
                  choices.append({"layer": int(found.group(1)), "tensor_name": name,
                                  "expert_count": item["shape"][2]})
          if not choices:
              print("Observed 3D tensor shapes (debug only):")
              print(json.dumps(report["three_dimensional_tensors"][:40], indent=2))
              raise AssertionError("CI MoE fixture has no explicitly identified third-axis expert tensors")
          by_layer = {}
          for choice in choices:
              by_layer.setdefault(choice["layer"], {})[
                  choice["tensor_name"].split(".")[2]] = choice["expert_count"]
          observed_layers = {row["layer"] for row in events}
          assert observed_layers, "real CPU router did not select experts"
          for layer in observed_layers:
              projections = by_layer.get(layer)
              assert projections is not None and len(projections) == 3, (
                  f"layer {layer} lacks complete up/down/gate expert slabs")
              assert len(set(projections.values())) == 1, (
                  f"layer {layer} fused projections disagree on expert count")
          (root / "real-moe-fused-selections.json").write_text(json.dumps(choices))
          available_by_layer = {
              layer: next(iter(projections.values()))
              for layer, projections in by_layer.items()
          }
          selected = [row for row in events
                      if row["layer"] in available_by_layer
                      and row["expert_id"] < available_by_layer[row["layer"]]]
          assert len(selected) == len(events), (
              "every authoritative graph router selection must be covered by external GGUF slabs")
          (root / "real-moe-layer-router.json").write_text(json.dumps(selected))
          print(f"Checking {len(choices)} fused tensor projections across "
                f"{len(observed_layers)} actual routed MoE layers")
          PY
          target/debug/kiln-bench expert-pack-fused \
            --source-gguf "$MODEL" \
            --selections-file "$RUNNER_TEMP/real-moe-fused-selections.json" \
            --blob-file "$RUNNER_TEMP/real-moe-fused.bin" \
            --index-file "$RUNNER_TEMP/real-moe-fused.index.json" \
            --integrity-file "$RUNNER_TEMP/real-moe-fused.integrity.json" \
            --components-file "$RUNNER_TEMP/real-moe-fused.components.json" \
            --json > "$RUNNER_TEMP/real-moe-pack-result.json"
          python3 - "$RUNNER_TEMP/real-moe-pack-result.json" <<'PY'
          import json
          import sys
          result = json.load(open(sys.argv[1], encoding="utf-8"))
          assert result["exact_source_bytes_verified"] is True
          assert result["experts"] > 0 and result["components"] > 0
          print("Fused quantized GGUF expert slabs packed with byte-exact source parity")
          PY
          target/debug/kiln-bench expert-export-gguf-stream-index \
            --source-gguf "$MODEL" --auto-verified \
            --output-file "$RUNNER_TEMP/real-moe-auto-stream-index.tsv" \
            --json > "$RUNNER_TEMP/real-moe-auto-stream-index-result.json"
          target/debug/kiln-bench expert-export-gguf-stream-index \
            --source-gguf "$MODEL" \
            --selections-file "$RUNNER_TEMP/real-moe-fused-selections.json" \
            --output-file "$RUNNER_TEMP/real-moe-explicit-stream-index.tsv" \
            --json > "$RUNNER_TEMP/real-moe-explicit-stream-index-result.json"
          cmp "$RUNNER_TEMP/real-moe-auto-stream-index.tsv" \
              "$RUNNER_TEMP/real-moe-explicit-stream-index.tsv"
          python3 - "$RUNNER_TEMP/real-moe-auto-stream-index-result.json" <<'PY'
          import json
          import sys
          report = json.load(open(sys.argv[1], encoding="utf-8"))
          assert report["layout_selection"] == "metadata_verified_complete"
          assert report["entries"] > 0
          assert report["requires_duplicate_sidecar"] is False
          print("Complete metadata-verified MoE tensor discovery matches explicit GGUF offset index")
          PY
          target/debug/kiln-bench expert-export-stream-index \
            --blob-file "$RUNNER_TEMP/real-moe-fused.bin" \
            --index-file "$RUNNER_TEMP/real-moe-fused.index.json" \
            --integrity-file "$RUNNER_TEMP/real-moe-fused.integrity.json" \
            --components-file "$RUNNER_TEMP/real-moe-fused.components.json" \
            --output-file "$RUNNER_TEMP/real-moe-stream-index.tsv" \
            --json > "$RUNNER_TEMP/real-moe-stream-index-result.json"
          KILN_MOE_STREAM_BLOB="$RUNNER_TEMP/real-moe-fused.bin" \
          KILN_MOE_STREAM_INDEX="$RUNNER_TEMP/real-moe-stream-index.tsv" \
          KILN_MOE_STREAM_AUDIT="$RUNNER_TEMP/real-moe-stream-audit.tsv" \
            target/debug/kiln bench "$MODEL" --native-greedy \
              --tokens 8 --warmup 0 --runs 1 --threads 2 --batch 128 \
              --ubatch 64 --json > "$RUNNER_TEMP/real-moe-external-compute.json"
          python3 - "$RUNNER_TEMP" <<'PY'
          import json
          import pathlib
          import sys
          root = pathlib.Path(sys.argv[1])
          baseline = json.loads((root / "real-moe-inference.json").read_text())
          streamed = json.loads((root / "real-moe-external-compute.json").read_text())
          assert baseline["runs"][0]["generated_tokens"] == streamed["runs"][0]["generated_tokens"]
          assert baseline["runs"][0]["token_fingerprint_fnv1a64"] == streamed["runs"][0]["token_fingerprint_fnv1a64"]
          audit = (root / "real-moe-stream-audit.tsv").read_text().splitlines()
          rows = [line.split("\t") for line in audit]
          selected = json.loads((root / "real-moe-fused-selections.json").read_text())
          tensor_names = {item["tensor_name"] for item in selected}
          assert {row[0] for row in rows} == tensor_names, (
              "all MoE tensor projections must execute the graph's external expert path")
          assert all(len(row) == 6 for row in rows), "cache byte evidence missing"
          assert all(int(row[1]) > 0 and int(row[2]) == int(row[1]) and
                     int(row[3]) > 0 for row in rows), (
              "all selected expert slabs in every routed MoE layer must be externally loaded")
          assert sum(int(row[5]) for row in rows) > 0, "no hot expert cache reuse"
          assert sum(int(row[4]) for row in rows) < sum(int(row[3]) for row in rows), (
              "bounded cache did not reduce repeated external pread volume"
          )
          print("Real CPU MoE matmul used actual pread sidecar weights with exact token parity")
          PY
          KILN_MOE_STREAM_CACHE_MIB=0 \
          KILN_MOE_STREAM_BLOB="$RUNNER_TEMP/real-moe-fused.bin" \
          KILN_MOE_STREAM_INDEX="$RUNNER_TEMP/real-moe-stream-index.tsv" \
          KILN_MOE_STREAM_AUDIT="$RUNNER_TEMP/real-moe-uncached-audit.tsv" \
            target/debug/kiln bench "$MODEL" --native-greedy \
              --tokens 8 --warmup 0 --runs 1 --threads 2 --batch 128 \
              --ubatch 64 --json > "$RUNNER_TEMP/real-moe-uncached-compute.json"
          python3 - "$RUNNER_TEMP" <<'PY'
          import json
          import pathlib
          import sys
          root = pathlib.Path(sys.argv[1])
          original = json.loads((root / "real-moe-inference.json").read_text())
          uncached = json.loads((root / "real-moe-uncached-compute.json").read_text())
          assert original["runs"][0]["token_fingerprint_fnv1a64"] == \
                 uncached["runs"][0]["token_fingerprint_fnv1a64"]
          audit = [line.split("\t") for line in
                   (root / "real-moe-uncached-audit.tsv").read_text().splitlines()]
          assert audit and all(len(r) == 6 and int(r[5]) == 0 for r in audit)
          assert all(int(r[1]) == int(r[2]) for r in audit)
          assert sum(int(r[3]) for r in audit) == sum(int(r[4]) for r in audit)
          print("Zero-cache MoE stream path maintained exact parity with genuine pread for every expert slab")
          PY
          KILN_MOE_STREAM_PARALLEL=1 KILN_STREAM_TEST_TOKENS=8 KILN_CPU_THREADS=2 KILN_STREAM_LAZY_MOE=1 \
            bash scripts/run_cpu_moe_stream_experiment.sh "$MODEL" \
            "$RUNNER_TEMP/real-moe-fused-selections.json" \
            "$RUNNER_TEMP/real-moe-stream-script-proof" \
            > "$RUNNER_TEMP/real-moe-stream-script-result.json"
          python3 - "$RUNNER_TEMP/real-moe-stream-script-proof/proof.json" <<'PY'
          import json
          import sys
          report = json.load(open(sys.argv[1], encoding="utf-8"))
          assert report["baseline_external_tokens_identical"]
          assert report["sidecar_matmul_tensors_covered"] == report["explicit_tensors"]
          assert report["external_bytes_read"] > 0
          assert report["external_expert_bytes_served"] >= report["external_bytes_read"]
          assert report["hot_expert_cache_hits"] > 0, "no direct-GGUF expert cache reuse"
          assert report["external_matmul_ops"] > 0
          assert report["external_decode_forward_tps"] > 0
          assert report["external_kernel_attributed_storage_read_bytes"] is not None
          assert report["external_kernel_attributed_storage_read_bytes"] >= 0
          assert report["external_kernel_attributed_storage_read_mib_per_token"] is not None
          assert report["external_process_peak_rss_kib"] > 0
          assert report["source_mode"] == "original_gguf"
          assert report["lazy_moe_experts_enabled"] is True
          assert report["duplicate_weight_blob_required"] is False
          assert report["tier0_deployment_accepted"] is False
          print("Real one-model-file GGUF pread inference passed exact-token parity")
          print("Reproducible hardware runner passed external inference parity gate")
          PY
          target/debug/kiln-bench expert-io \
            --file "$RUNNER_TEMP/real-moe-fused.bin" \
            --index-file "$RUNNER_TEMP/real-moe-fused.index.json" \
            --trace-file "$RUNNER_TEMP/real-moe-layer-router.json" \
            --block-bytes 1048576 --runs 1 --json \
            > "$RUNNER_TEMP/real-moe-fused-replay.json"
          python3 - "$RUNNER_TEMP/real-moe-fused-replay.json" <<'PY'
          import json
          import sys
          report = json.load(open(sys.argv[1], encoding="utf-8"))
          assert report["patterns"][0]["access_pattern"] == "router-trace"
          assert report["patterns"][0]["total_bytes_read"] > 0
          print("Actual router-selected expert byte ranges replayed from packed GGUF slabs")
          PY

      - name: Smoke-test actual model next-token quality evidence with exact self-parity
        env:
          KILN_MODELS_DIR: ${{ runner.temp }}/kiln-models
        run: |
          MODEL="$KILN_MODELS_DIR/mradermacher--tiny-random-granite-moe-GGUF/tiny-random-granite-moe.Q4_K_M.gguf"
          printf 'This is a controlled real model corpus. Tokens are scored on the same text in a fixed context window.\n' > "$RUNNER_TEMP/quality-fixture.txt"
          target/debug/kiln eval-ppl "$MODEL" --text-file "$RUNNER_TEMP/quality-fixture.txt" \
            --max-tokens 16 --window-tokens 128 --threads 2 --json \
            > "$RUNNER_TEMP/quality-reference.json"
          KILN_MOE_STREAM_BLOB="$MODEL" \
          KILN_MOE_STREAM_INDEX="$RUNNER_TEMP/real-moe-auto-stream-index.tsv" \
          KILN_MOE_STREAM_AUDIT="$RUNNER_TEMP/quality-external-audit.tsv" \
            target/debug/kiln eval-ppl "$MODEL" \
              --text-file "$RUNNER_TEMP/quality-fixture.txt" \
              --max-tokens 16 --window-tokens 128 --threads 2 --json \
              > "$RUNNER_TEMP/quality-candidate.json"
          python3 scripts/compare_quality_parity.py \
            --reference "$RUNNER_TEMP/quality-reference.json" \
            --candidate "$RUNNER_TEMP/quality-candidate.json" \
            --max-relative-ppl-loss 0.01 \
            --out "$RUNNER_TEMP/quality-self-parity.json"
          python3 - "$RUNNER_TEMP/quality-self-parity.json" <<'PY'
          import json
          import sys
          proof = json.load(open(sys.argv[1], encoding="utf-8"))
          assert proof["status"] == "pass"
          assert abs(proof["relative_perplexity_loss"]) <= 1e-4, (
              "actual externally sourced MoE expert weights changed next-token likelihood"
          )
          assert proof["tier0_deployment_accepted"] is False
          from pathlib import Path
          audit = Path(sys.argv[1]).with_name("quality-external-audit.tsv")
          rows = [line.split("\t") for line in audit.read_text().splitlines()]
          assert rows and all(int(row[1]) == int(row[2]) and int(row[1]) > 0 for row in rows), (
              "actual next-token likelihood was scored without all selected expert slab I/O"
          )
          print("Original-GGUF externally sourced MoE expert logits preserve baseline perplexity")
          PY

      - name: Verify native external MoE log-likelihood parity, not only generated tokens
        env:
          KILN_MODELS_DIR: ${{ runner.temp }}/kiln-models
        run: |
          MODEL="$KILN_MODELS_DIR/mradermacher--tiny-random-granite-moe-GGUF/tiny-random-granite-moe.Q4_K_M.gguf"
          test -s "$MODEL"
          printf 'A model should agree with the same source weights during expert streaming. ' > "$RUNNER_TEMP/moe-quality-text.txt"
          printf 'Exact next token likelihood matters beyond greedy sequence equality.\n' >> "$RUNNER_TEMP/moe-quality-text.txt"
          target/debug/kiln eval-ppl "$MODEL" \
            --text-file "$RUNNER_TEMP/moe-quality-text.txt" --max-tokens 24 \
            --window-tokens 32 --threads 2 --json \
            > "$RUNNER_TEMP/moe-quality-baseline.json"
          KILN_MOE_STREAM_BLOB="$MODEL" \
          KILN_MOE_STREAM_INDEX="$RUNNER_TEMP/real-moe-auto-stream-index.tsv" \
          KILN_MOE_STREAM_CACHE_MIB=32 \
          KILN_MOE_STREAM_PARALLEL=1 \
          KILN_MOE_STREAM_AUDIT="$RUNNER_TEMP/moe-quality-external-audit.tsv" \
            target/debug/kiln eval-ppl "$MODEL" \
              --text-file "$RUNNER_TEMP/moe-quality-text.txt" --max-tokens 24 \
              --window-tokens 32 --threads 2 --json \
              > "$RUNNER_TEMP/moe-quality-external.json"
          python3 - "$RUNNER_TEMP" <<'PY'
          import json
          from pathlib import Path
          import sys
          root = Path(sys.argv[1])
          baseline = json.loads((root / "moe-quality-baseline.json").read_text())
          streamed = json.loads((root / "moe-quality-external.json").read_text())
          for key in ("token_fingerprint_fnv1a64", "token_ids_sha256_le_i32",
                      "evaluated_token_count", "scored_target_tokens", "window_tokens"):
              assert baseline[key] == streamed[key], f"quality-eval mismatch in {key}"
          assert abs(baseline["mean_nll_nats"] - streamed["mean_nll_nats"]) < 1e-6, (
              "external expert dot-product changed next-token log likelihood"
          )
          assert abs(baseline["perplexity"] - streamed["perplexity"]) < 1e-5
          assert streamed["deployment_accepted"] is False
          rows = [row.split("\t") for row in
                  (root / "moe-quality-external-audit.tsv").read_text().splitlines()]
          expected = {entry["tensor_name"] for entry in json.loads(
              (root / "real-moe-fused-selections.json").read_text())}
          assert {row[0] for row in rows} == expected
          assert rows and all(len(row) == 6 and int(row[1]) == int(row[2]) and
                              int(row[1]) > 0 for row in rows)
          print("Real streamed MoE log-likelihood, perplexity, SHA-256 token IDs and full expert load parity passed")
          PY

