name: CI

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository and llama.cpp submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Build llama.cpp static libraries
        run: |
          cmake -S vendor/llama.cpp -B vendor/llama.cpp/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_TOOLS=OFF \
            -DLLAMA_BUILD_COMMON=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            -DLLAMA_BUILD_APP=OFF
          cmake --build vendor/llama.cpp/build --config Release --parallel 2

      - name: Check formatting (advisory until baseline formatting debt is resolved)
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: Test synthetic MoE cache simulator
        run: python3 -m unittest scripts.test_synthetic_moe_cache_bench -v

      - name: Run workspace tests
        run: cargo test --workspace --all-targets
