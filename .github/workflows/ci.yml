name: CI

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository and llama.cpp submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify native build tools already present on Ubuntu runner
        run: |
          cmake --version
          c++ --version
          make --version

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Build llama.cpp static libraries
        run: |
          cmake -S vendor/llama.cpp -B vendor/llama.cpp/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_TOOLS=OFF \
            -DLLAMA_BUILD_COMMON=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            -DLLAMA_BUILD_APP=OFF
          cmake --build vendor/llama.cpp/build --config Release --parallel 2

      - name: Check formatting (advisory until baseline formatting debt is resolved)
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: Test synthetic MoE cache simulator
        run: python3 -m unittest scripts.test_synthetic_moe_cache_bench -v

      - name: Test Tier 0 feasibility report assessor
        run: python3 -m unittest scripts.test_assess_tier0_gate5a -v

      - name: Test Phase 3.5 evidence summary and capture scripts
        run: |
          python3 -m unittest scripts.test_summarize_phase35 -v
          python3 -m unittest scripts.test_capture_phase35_ollama -v
          bash -n scripts/run_phase35_suite.sh scripts/run_tier0_dense_matrix.sh scripts/profile_phase35_hotpath.sh scripts/run_tier0_gate5a.sh

      - name: Run workspace tests
        run: cargo test --workspace --all-targets

      - name: Build the API executable for browser testing
        run: cargo build -p kiln-cli

      - name: Set up Node.js for local UI release checks
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/ui-e2e/package-lock.json

      - name: Install UI browser-test dependencies
        run: npm ci --prefix tools/ui-e2e

      - name: Install headless Chromium
        run: npx --prefix tools/ui-e2e playwright install --with-deps chromium

      - name: Start the local API without a model
        run: |
          mkdir -p "$RUNNER_TEMP/kiln-models"
          KILN_MODELS_DIR="$RUNNER_TEMP/kiln-models" target/debug/kiln serve --host 127.0.0.1 --port 11435 > "$RUNNER_TEMP/kiln-api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/kiln-api.pid"
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:11435/api/version >/dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/kiln-api.log"
          exit 1

      - name: Run browser, accessibility, and responsive UI checks
        run: npm test --prefix tools/ui-e2e

      - name: Stop the no-model API
        if: always()
        run: if [ -f "$RUNNER_TEMP/kiln-api.pid" ]; then kill "$(cat "$RUNNER_TEMP/kiln-api.pid")" || true; fi

      - name: Download and verify a real smoke-test model
        env:
          KILN_MODELS_DIR: ${{ runner.temp }}/kiln-models
        run: target/debug/kiln pull QuantFactory/SmolLM2-135M-Instruct-GGUF --file SmolLM2-135M-Instruct.Q4_K_M.gguf

      - name: Smoke-test Phase 3.5 real-model benchmark commands
        env:
          KILN_TEST_MODEL_PATH: ${{ runner.temp }}/kiln-models/QuantFactory--SmolLM2-135M-Instruct-GGUF/SmolLM2-135M-Instruct.Q4_K_M.gguf
        run: |
          target/debug/kiln bench "$KILN_TEST_MODEL_PATH" --tokens 8 --warmup 0 --runs 1 --threads 2 --batch 128 --ubatch 64 --json > "$RUNNER_TEMP/phase35-dense.json"
          target/debug/kiln bench-spec "$KILN_TEST_MODEL_PATH" --tokens 8 --warmup 0 --runs 1 --threads 2 --batch 128 --ubatch 64 --draft-max 4 --json > "$RUNNER_TEMP/phase35-spec.json"
          target/debug/kiln bench-kv "$KILN_TEST_MODEL_PATH" --runs 1 --threads 2 --batch 128 --ubatch 64 --json > "$RUNNER_TEMP/phase35-kv.json"
          python3 - "$RUNNER_TEMP" <<'PY'
          import json
          import pathlib
          import sys
          root = pathlib.Path(sys.argv[1])
          dense = json.loads((root / "phase35-dense.json").read_text())
          spec = json.loads((root / "phase35-spec.json").read_text())
          kv = json.loads((root / "phase35-kv.json").read_text())
          assert dense["sampling_path"] == "rust_logits_greedy"
          assert dense["requested_microbatch"] == 64
          assert spec["all_output_sequences_equal"] is True
          assert kv["all_argmax_equal"] is True
          print("Phase 3.5 real-GGUF benchmark smoke passed")
          PY

      - name: Test interactive speculative CLI parity on the smoke model
        env:
          KILN_TEST_MODEL_PATH: ${{ runner.temp }}/kiln-models/QuantFactory--SmolLM2-135M-Instruct-GGUF/SmolLM2-135M-Instruct.Q4_K_M.gguf
        run: cargo test -p kiln-cli --test interactive_speculative_parity -- --ignored --nocapture

      - name: Prepare real activation and recovery candidates
        run: |
          MODEL="$RUNNER_TEMP/kiln-models/QuantFactory--SmolLM2-135M-Instruct-GGUF/SmolLM2-135M-Instruct.Q4_K_M.gguf"
          ln "$MODEL" "$RUNNER_TEMP/kiln-models/alternate-smoke.gguf"
          python3 tools/ui-e2e/create_bad_arch_model.py "$MODEL" "$RUNNER_TEMP/kiln-models/zz-invalid-arch.gguf"

      - name: Start the local API with the real model
        run: |
          KILN_MODELS_DIR="$RUNNER_TEMP/kiln-models" \
          KILN_MODEL_PATH="$RUNNER_TEMP/kiln-models/QuantFactory--SmolLM2-135M-Instruct-GGUF/SmolLM2-135M-Instruct.Q4_K_M.gguf" \
          target/debug/kiln serve --host 127.0.0.1 --port 11435 > "$RUNNER_TEMP/kiln-api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/kiln-api.pid"
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:11435/api/tags >/dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/kiln-api.log"
          exit 1

      - name: Smoke-test real model chat in Chromium
        env:
          KILN_MODELS_DIR: ${{ runner.temp }}/kiln-models
        run: node tools/ui-e2e/real-smoke.cjs

      - name: Stop the local API
        if: always()
        run: if [ -f "$RUNNER_TEMP/kiln-api.pid" ]; then kill "$(cat "$RUNNER_TEMP/kiln-api.pid")" || true; fi
