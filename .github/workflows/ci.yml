      - name: Build and prove portable Linux single-binary release against real MoE GGUF
        env:
          KILN_MODELS_DIR: ${{ runner.temp }}/kiln-models
        run: |
          # Earlier native/UI tests may rewrite tracked working-tree files.
          # Release compilation MUST use exactly the checked-out PR commit.
          # CI workspace is disposable; never reset a developer's local tree.
          git status --short > "$RUNNER_TEMP/kiln-pre-package-status.txt"
          git restore --source=HEAD --worktree -- .
          git -C vendor/llama.cpp restore --source=HEAD --worktree -- .
          if ! git diff --quiet || ! git diff --cached --quiet; then
            cat "$RUNNER_TEMP/kiln-pre-package-status.txt"
            echo "CI checkout still differs from tracked release source" >&2
            exit 1
          fi
          bash scripts/build_linux_release.sh "$RUNNER_TEMP/kiln-portable-release" \
            > "$RUNNER_TEMP/kiln-package-build.log"
          python3 - "$RUNNER_TEMP/kiln-portable-release" <<'PY'
          import glob
          import json
          import pathlib
          import sys
          import tarfile
          root = pathlib.Path(sys.argv[1])
          candidates = list(root.glob("kiln-linux-*.json"))
          assert len(candidates) == 1
          meta = json.loads(candidates[0].read_text(encoding="utf-8"))
          assert meta["artifact_type"] == "single_executable_linux_release"
          assert meta["ggml_native"] is False
          assert meta["cpu_variant"] == "baseline_no_optional_x86_simd"
          assert meta["tier0_deployment_accepted"] is False
          assert meta["included_model_weights"] is False
          archives = list(root.glob("*.tar.gz"))
          assert len(archives) == 1
          with tarfile.open(archives[0]) as archive:
              names = set(archive.getnames())
          assert names == {"kiln","LICENSE","THIRD_PARTY_NOTICES.md"}
          print("Portable release artifact contains one executable, license and provenance")
          PY
          MODEL="$KILN_MODELS_DIR/mradermacher--tiny-random-granite-moe-GGUF/tiny-random-granite-moe.Q4_K_M.gguf"
          target/release/kiln bench "$MODEL" --native-greedy --tokens 8 \
            --warmup 0 --runs 1 --threads 2 --batch 128 --ubatch 64 \
            --json > "$RUNNER_TEMP/real-moe-release-inference.json"
          python3 - "$RUNNER_TEMP/real-moe-release-inference.json" "$RUNNER_TEMP/real-moe-inference.json" <<'PY'
          import json
          import sys
          released, debug = (json.load(open(p, encoding="utf-8")) for p in sys.argv[1:])
          assert released["runs"][0]["generated_tokens"] == debug["runs"][0]["generated_tokens"]
          assert released["runs"][0]["token_fingerprint_fnv1a64"] == debug["runs"][0]["token_fingerprint_fnv1a64"]
          print("Portable one-binary release generates identical real-model greedy tokens")
          PY

      - name: Verify and install Linux release candidate atomically without overwriting existing KILN
        run: |
          ARCHIVE="$(find "$RUNNER_TEMP/kiln-portable-release" -maxdepth 1 -name '*.tar.gz' -print -quit)"
          test -s "$ARCHIVE"
          bash scripts/install_linux_release.sh "$ARCHIVE" "$RUNNER_TEMP/kiln-installed" \
            > "$RUNNER_TEMP/kiln-install-proof.txt"
          "$RUNNER_TEMP/kiln-installed/kiln" --help > "$RUNNER_TEMP/kiln-installed-help.txt"
          "$RUNNER_TEMP/kiln-installed/kiln" stream --help > "$RUNNER_TEMP/kiln-installed-stream-help.txt"
          KILN_MODELS_DIR="$RUNNER_TEMP/kiln-models" \
            "$RUNNER_TEMP/kiln-installed/kiln" serve --host 127.0.0.1 --port 11436 \
            > "$RUNNER_TEMP/kiln-installed-api.log" 2>&1 &
          INSTALLED_PID=$!
          READY=0
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:11436/api/version \
              > "$RUNNER_TEMP/kiln-installed-api-version.json"; then
              READY=1
              break
            fi
            sleep 1
          done
          kill "$INSTALLED_PID" || true
          wait "$INSTALLED_PID" || true
          if [ "$READY" -ne 1 ]; then
            cat "$RUNNER_TEMP/kiln-installed-api.log"
            echo "Installed portable KILN server did not become healthy" >&2
            exit 1
          fi
          test -s "$RUNNER_TEMP/kiln-installed-api-version.json"
          MODEL="$RUNNER_TEMP/kiln-models/mradermacher--tiny-random-granite-moe-GGUF/tiny-random-granite-moe.Q4_K_M.gguf"
          printf 'Run the installed experimental CPU MoE stream.\n/exit\n' | \
            timeout 120 "$RUNNER_TEMP/kiln-installed/kiln" stream "$MODEL" \
              --max-tokens 6 --cache-mib 8 --parallel-reads \
              > "$RUNNER_TEMP/kiln-installed-real-moe-stream.txt" \
              2> "$RUNNER_TEMP/kiln-installed-real-moe-stream-evidence.txt"
          grep -F 'KILN interactive session' "$RUNNER_TEMP/kiln-installed-real-moe-stream.txt"
          grep -F 'experimental CPU MoE' "$RUNNER_TEMP/kiln-installed-real-moe-stream-evidence.txt"
          "$RUNNER_TEMP/kiln-installed/kiln" eval-ppl "$MODEL" \
            --text-file "$RUNNER_TEMP/quality-fixture.txt" \
            --max-tokens 16 --window-tokens 128 --threads 2 --json \
            > "$RUNNER_TEMP/kiln-installed-quality.json"
          python3 scripts/compare_quality_parity.py \
            --reference "$RUNNER_TEMP/quality-reference.json" \
            --candidate "$RUNNER_TEMP/kiln-installed-quality.json" \
            --max-relative-ppl-loss 0.01 \
            --out "$RUNNER_TEMP/kiln-installed-quality-verdict.json"
          python3 - "$RUNNER_TEMP/kiln-installed-quality-verdict.json" <<'PY'
          import json
          import sys
          report = json.load(open(sys.argv[1], encoding="utf-8"))
          assert report["status"] == "pass"
          assert report["tier0_deployment_accepted"] is False
          print("Installed portable binary streamed actual MoE inference and preserved reference-model perplexity")
          PY
          if bash scripts/install_linux_release.sh "$ARCHIVE" "$RUNNER_TEMP/kiln-installed"; then
            echo "Installer unexpectedly overwrote an existing binary" >&2
            exit 1
          fi
          test -s "$RUNNER_TEMP/kiln-installed/kiln"
          test -s "$RUNNER_TEMP/kiln-install-proof.txt"
          echo "Archive checksum, executable digest, architecture, one-binary and no-overwrite install checks passed"

