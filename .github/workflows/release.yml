name: Linux release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source and pinned native submodule
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Validate release source
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          case "$GITHUB_REF" in
            refs/tags/v*) echo "Publishing versioned release from $GITHUB_REF_NAME" ;;
            refs/heads/main) echo "Publishing main preview from $GITHUB_SHA" ;;
            *) echo 'Publish only from main or a version tag' >&2; exit 1 ;;
          esac

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run workspace tests on the release source
        run: |
          cmake -S vendor/llama.cpp -B vendor/llama.cpp/build \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_TOOLS=OFF \
            -DLLAMA_BUILD_COMMON=OFF -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=OFF -DLLAMA_BUILD_APP=OFF
          cmake --build vendor/llama.cpp/build --config Release --parallel 2
          cargo test --locked --workspace --all-targets

      - name: Set Debian package version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "KILN_DEB_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "KILN_DEB_VERSION=0.0.1~preview+${GITHUB_SHA:0:12}" >> "$GITHUB_ENV"
          fi

      - name: Build portable Linux release assets
        run: bash scripts/build_linux_release.sh

      - name: Verify Debian package contents and executable
        run: |
          package=(dist/kiln-linux-*.deb)
          test -s "${package[0]}"
          dpkg-deb --info "${package[0]}"
          dpkg-deb --contents "${package[0]}"
          dpkg-deb --extract "${package[0]}" "$RUNNER_TEMP/kiln-deb-root"
          test -x "$RUNNER_TEMP/kiln-deb-root/usr/bin/kiln"
          test -s "$RUNNER_TEMP/kiln-deb-root/usr/share/applications/kiln.desktop"
          test -s "$RUNNER_TEMP/kiln-deb-root/usr/share/icons/hicolor/scalable/apps/kiln.svg"
          dpkg-deb -f "${package[0]}" Depends | grep -q 'python3-gi'
          dpkg-deb -f "${package[0]}" Depends | grep -q 'gir1.2-webkit2-4.1'
          "$RUNNER_TEMP/kiln-deb-root/usr/bin/kiln" --help >/dev/null
          "$RUNNER_TEMP/kiln-deb-root/usr/bin/kiln" dashboard --help >/dev/null

      - name: Publish persistent GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(dist/kiln-linux-*.tar.gz dist/kiln-linux-*.deb dist/kiln-linux-*.json \
            dist/kiln-linux-*.sha256 dist/kiln-linux-*.bin)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            release_tag="$GITHUB_REF_NAME"
            release_title="$GITHUB_REF_NAME"
            gh release create "$release_tag" "${assets[@]}" \
              --verify-tag --generate-notes --title "$release_title"
          else
            short_sha="${GITHUB_SHA:0:12}"
            release_tag="preview-$short_sha"
            release_title="KILN Linux Preview ($short_sha)"
            notes_file="$RUNNER_TEMP/kiln-release-notes.md"
            cat > "$notes_file" <<EOF
          This is a persistent, downloadable KILN Linux build from main commit \`$GITHUB_SHA\`.

          It is marked as a preview because Dell Latitude 7490 throughput, memory, quality, thermal and physical-storage acceptance remains open. It has not passed production deployment acceptance.
          EOF
            if gh release view "$release_tag" >/dev/null 2>&1; then
              gh release upload "$release_tag" "${assets[@]}" --clobber
            else
              gh release create "$release_tag" "${assets[@]}" --target "$GITHUB_SHA" \
                --prerelease --title "$release_title" --notes-file "$notes_file"
            fi
          fi
